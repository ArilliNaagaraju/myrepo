<!-- Parent component passing data to child component.

Parent component receiving data from child component.

Parent component manipulating child component.

Parent and child component interact using a common service. -->

<app-comp-interaction [parentcomponet]="messageFromParent"(childEvent)="receiveData($event)"/>
    <p>Data from Child: {{ messageFromChild }}</p>
    <p>Parent Controls:</p>
    <button (click)="increment()">Increment</button>
    <button (click)="decrement()">Decrement</button>
